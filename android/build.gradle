// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.6.0")          // ✅ specify version
        classpath("com.facebook.react:react-native-gradle-plugin") // ✅ for React Native
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20") // ✅ match Kotlin version used by Expo
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url "https://jitpack.io" }
    }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
